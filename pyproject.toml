[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "c3xdis"
version = "0.1.0"
description = "Disassembler for the Texas Instruments TMS320C3x DSP family"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Andy Bardagjy" }]
keywords = ["tms320", "tms320c3x", "c30", "c31", "c32", "dsp",
            "disassembler", "reverse-engineering", "firmware"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Disassemblers",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/abardagjy/tms320c3x-dis"
Issues = "https://github.com/abardagjy/tms320c3x-dis/issues"

[project.scripts]
c3xdis = "c3xdis.cli:main"

[tool.setuptools]
packages = ["c3xdis"]
